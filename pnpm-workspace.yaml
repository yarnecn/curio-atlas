packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  core-js: true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: true
  sharp: true

minimumReleaseAgeExclude:
  - '@types/node@26.4.1'
  - webpack@5.110.3

ignoredOptionalDependencies:
  - pg

overrides:
  'brace-expansion@^1': 1.1.20
  'brace-expansion@^2': 2.1.6
  'brace-expansion@^5': 5.0.11
  compression: 1.8.2
  'joi@^17': 17.13.7
  proxy-addr: 2.0.8
  sharp: 0.35.5
  shell-quote: 1.11.0
  source-map-js: 1.2.2
  webpack-dev-middleware: 7.4.5
  fast-uri: 3.1.7
  multer: 2.5.0
  'body-parser@^2': 2.4.0
  qs: 6.16.1
  minipass: 7.1.2
  serialize-javascript: 7.1.1
  swiper: 12.2.0
  terser-webpack-plugin: 5.3.14
  vite: 6.4.3

peerDependencyRules:
  allowedVersions:
    vite: 6.4.3
